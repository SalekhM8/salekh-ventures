<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!--
    SV monogram. White on transparent. For clothing printing.
    Font: Inter, weight 700, letter-spacing -22.
    If your print shop's system does not have Inter installed,
    open this in Figma / Illustrator and run Type > Create Outlines
    so the letters are converted to vector paths.
  -->
  <text x="300" y="335"
        text-anchor="middle"
        dominant-baseline="middle"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-weight="700"
        font-size="420"
        letter-spacing="-22"
        fill="#ffffff">SV</text>
</svg>
